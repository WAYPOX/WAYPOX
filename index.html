<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAYPOX - Coming Soon</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #1f005c, #5b0060, #870160, #ac255e, #ca485c, #e16b5c);
    background-size: 400% 400%;
    animation: bgAnimation 12s infinite alternate;
    color:white;
}

@keyframes bgAnimation{
    0%{background-position:0% 50%;}
    100%{background-position:100% 50%;}
}

.container{
    text-align:center;
    padding:40px;
    border-radius:20px;
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.1);
    box-shadow: 0 0 40px rgba(0,0,0,0.4);
}

h1{
    font-size:80px;
    letter-spacing:8px;
    font-weight:bold;
    background: linear-gradient(45deg, #00f5ff, #ff00c8, #00ff99);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow: 
        4px 4px 0px rgba(0,0,0,0.3),
        8px 8px 20px rgba(0,0,0,0.5);
}

h2{
    margin-top:20px;
    font-size:28px;
    font-weight:500;
}

p{
    margin-top:15px;
    font-size:18px;
    opacity:0.9;
}

.footer{
    margin-top:30px;
    font-size:14px;
    opacity:0.7;
}
</style>
</head>

<body>

<div class="container">
    <h1>WAYPOX</h1>
    <h2>🚀 Website Under Development</h2>
    <p>
        WAYPOX Platform is currently under construction.<br>
        Our app services and digital solutions will be launching soon.
    </p>
    <p>
        Please stay connected. We are working hard to deliver the best experience.
    </p>
    <div class="footer">
        © 2026 WAYPOX PLATFORM | All Rights Reserved
    </div>
</div>

</body>
</html>
